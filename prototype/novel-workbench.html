<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 小说创作工作台 · 原型</title>
  <style>
    :root{--ink:#172033;--muted:#718096;--line:rgba(37,52,79,.11);--glass:rgba(255,255,255,.68);--glass-strong:rgba(255,255,255,.88);--blue:#4263eb;--purple:#8864e8;--shadow:0 24px 70px rgba(42,57,92,.15)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef3fb;min-height:100vh;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;z-index:-1;filter:blur(2px);border-radius:999px;opacity:.95;pointer-events:none}.before{}
    body:before{width:680px;height:680px;left:-180px;top:-260px;background:radial-gradient(circle,rgba(152,188,255,.92) 0 18%,rgba(174,207,255,.48) 35%,rgba(198,220,255,0) 72%)}body:after{width:780px;height:780px;right:-260px;bottom:-360px;background:radial-gradient(circle,rgba(214,176,255,.8) 0 16%,rgba(228,213,255,.45) 35%,rgba(228,213,255,0) 70%)}
    button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{max-width:1500px;margin:0 auto;padding:22px 24px 88px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:720;letter-spacing:-.02em;font-size:16px}.mark{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;color:white;background:linear-gradient(135deg,#708cff,#9d73ee);box-shadow:0 8px 22px rgba(102,117,231,.32)}.top-actions{display:flex;gap:9px;align-items:center}.pill,.icon-btn,.primary,.ghost,.mini{border:1px solid var(--line);background:var(--glass);border-radius:13px;padding:9px 13px;box-shadow:0 8px 22px rgba(44,62,98,.06);backdrop-filter:blur(18px)}.icon-btn{width:37px;height:37px;padding:0;display:grid;place-items:center;font-size:16px}.primary{color:white;background:linear-gradient(135deg,#5572f2,#7b5ade);border-color:transparent;box-shadow:0 12px 24px rgba(92,95,220,.25)}.ghost{background:rgba(255,255,255,.42)}.mini{padding:6px 9px;border-radius:10px;font-size:12px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.shell{display:grid;grid-template-columns:244px minmax(460px,1fr) 320px;gap:18px}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(24px);border-radius:24px}.sidebar{padding:19px;min-height:calc(100vh - 140px)}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.work-list{display:grid;gap:7px}.work{padding:11px 12px;border-radius:14px;display:flex;gap:10px;align-items:center}.work.active{background:rgba(91,112,233,.11);color:#394cc0}.work .dot{width:9px;height:9px;border-radius:9px;background:#77a1ff}.side-section{margin-top:24px}.side-section h4{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}.chapter{padding:7px 10px;border-radius:10px;color:#63708b}.chapter.active{background:rgba(255,255,255,.8);color:var(--ink);font-weight:600}.main{padding:26px 34px;min-height:calc(100vh - 140px);background:rgba(255,255,255,.77);border:1px solid rgba(255,255,255,.84);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(28px)}.eyebrow{font-size:12px;color:#7a89a9;margin-bottom:8px}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.title-row h1{font-size:30px;line-height:1.18;letter-spacing:-.04em;margin:0 0 6px}.subtitle{color:var(--muted);margin:0}.toolbar{display:flex;gap:7px;border-block:1px solid var(--line);padding:12px 0;margin:22px 0 26px}.toolbar button{background:transparent;padding:4px 8px;color:#6f7b95;border-radius:7px}.toolbar button:hover{background:#edf1ff;color:#4056d5}.editor{max-width:700px;margin:auto;font-family:Georgia,"Songti SC",serif;font-size:18px;line-height:2.05;color:#263145;min-height:420px;outline:0}.editor h2{font-family:inherit;font-size:24px;line-height:1.4;margin:0 0 22px;color:#1d2b42}.editor p{margin:0 0 17px}.editor[contenteditable=true]:focus{outline:0}.statusline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:15px;margin-top:22px}.insight{padding:18px;min-height:calc(100vh - 140px)}.insight h3{margin:0;font-size:15px}.ai-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.model{font-size:11px;color:#6575cf;background:#eceeff;padding:5px 8px;border-radius:8px}.prompt{background:rgba(248,250,255,.88);border:1px solid var(--line);border-radius:15px;padding:12px;margin:12px 0}.prompt textarea{width:100%;background:transparent;border:0;resize:none;outline:0;color:var(--ink);min-height:56px}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.quick button{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}.result{margin-top:16px;padding:14px;border-radius:15px;background:linear-gradient(145deg,rgba(241,241,255,.9),rgba(255,255,255,.7));border:1px solid rgba(125,125,220,.16)}.result strong{display:block;margin-bottom:5px}.result-actions{display:flex;gap:7px;margin-top:11px}.result-actions button{font-size:12px;padding:7px 9px;border-radius:9px;background:#fff;border:1px solid var(--line)}.welcome{display:grid;grid-template-columns:1.12fr .88fr;gap:18px}.hero{padding:42px 42px;min-height:520px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(242,245,255,.52));border-radius:24px;border:1px solid rgba(255,255,255,.82);box-shadow:var(--shadow);backdrop-filter:blur(24px)}.hero h1{font-size:47px;line-height:1.06;letter-spacing:-.065em;max-width:560px;margin:8px 0 14px}.hero p{font-size:16px;color:#65728e;max-width:520px}.hero-actions{display:flex;gap:10px;margin-top:24px}.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:center}.entry{padding:23px;min-height:175px;background:var(--glass);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(23px);text-align:left}.entry:hover{transform:translateY(-2px);transition:transform .2s}.entry .emoji{font-size:24px}.entry h3{margin:13px 0 4px}.entry p{margin:0;color:var(--muted);font-size:12px}.dash{display:grid;grid-template-columns:1.18fr .82fr;gap:18px}.dash-main,.dash-side{padding:24px}.dash-main h1{font-size:27px;letter-spacing:-.04em;margin:0}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{padding:15px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:15px}.stat b{font-size:20px;display:block}.recent{display:grid;gap:9px}.recent-item{padding:15px;border-radius:15px;background:rgba(255,255,255,.55);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.focus{padding:18px;border-radius:18px;background:linear-gradient(135deg,#edf0ff,#f8f4ff);margin-top:15px}.focus h3{margin:0 0 7px}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:18px;height:18px;border-radius:6px;border:1px solid #b7c2dc;background:white}.check.done{background:#6d83ea;border-color:#6d83ea;color:white;display:grid;place-items:center;font-size:12px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:999px;background:#172033;color:white;box-shadow:0 15px 35px rgba(24,32,54,.28);z-index:5;font-size:12px}.switcher button{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.13);color:white}.switcher span{min-width:156px;text-align:center}.toast{position:fixed;right:24px;bottom:26px;background:#202b43;color:white;padding:10px 14px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1050px){.shell{grid-template-columns:210px 1fr}.insight{display:none}.hero h1{font-size:39px}}@media(max-width:720px){.app{padding:12px}.topbar{margin-bottom:8px}.shell,.welcome,.dash{grid-template-columns:1fr}.sidebar{min-height:auto}.main{padding:21px}.hero{padding:29px 24px}.hero h1{font-size:36px}.entry-grid{grid-template-columns:1fr 1fr}.toolbar{overflow:auto}.switcher span{min-width:118px}}
    /* Stronger glass treatment: translucent surfaces reveal the colored light behind them. */
    body:before{width:680px;height:680px;left:-180px;top:-260px;opacity:.95;background:radial-gradient(circle,rgba(152,188,255,.92) 0 18%,rgba(174,207,255,.48) 35%,rgba(198,220,255,0) 72%)}
    body:after{width:780px;height:780px;right:-260px;bottom:-360px;opacity:.95;background:radial-gradient(circle,rgba(214,176,255,.8) 0 16%,rgba(228,213,255,.45) 35%,rgba(228,213,255,0) 70%)}
    .glass{background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.18));border-color:rgba(255,255,255,.78);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.96);backdrop-filter:blur(30px) saturate(165%)}
    .main{background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(255,255,255,.24));border-color:rgba(255,255,255,.82);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.98);backdrop-filter:blur(32px) saturate(170%)}
    .pill,.icon-btn,.primary,.ghost,.mini{border-color:rgba(255,255,255,.78);background:rgba(255,255,255,.34);box-shadow:0 8px 22px rgba(44,62,98,.09),inset 0 1px 0 rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(160%)}
    .primary{color:white;background:linear-gradient(135deg,#5572f2,#7b5ade);border-color:transparent;box-shadow:0 12px 24px rgba(92,95,220,.25)}
    .ghost{background:rgba(255,255,255,.22)}
    body.desktop-glass{background:linear-gradient(135deg,#7898c7 0%,#8e82b5 48%,#c9879f 100%)}
    body.desktop-glass:before{background:radial-gradient(circle,rgba(126,220,255,.88) 0 18%,rgba(140,199,255,.38) 40%,transparent 72%)}
    body.desktop-glass:after{background:radial-gradient(circle,rgba(255,176,214,.78) 0 16%,rgba(222,180,255,.35) 38%,transparent 70%)}
    body.desktop-glass .glass{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.1));border-color:rgba(255,255,255,.58)}
    body.desktop-glass .main{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.18));border-color:rgba(255,255,255,.66)}
  </style>
</head>
<body>
  <div id="root"></div><div id="toast" class="toast"></div>
  <script>
    // PROTOTYPE — throwaway UI exploration for the AI novel workbench.
    const variants={A:'A · 三栏写作台',B:'B · 新手入口',C:'C · 作家仪表盘'};
    const params=new URLSearchParams(location.search);let active=params.get('variant')||'A';if(!variants[active])active='A';let glassMode=params.get('glass')==='desktop';document.body.classList.toggle('desktop-glass',glassMode);
    const root=document.querySelector('#root');
    function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function syncUrl(){history.replaceState({},'',location.pathname+'?variant='+active+(glassMode?'&glass=desktop':''))}
    function setVariant(v){active=v;syncUrl();render()}
    function toggleGlass(){glassMode=!glassMode;document.body.classList.toggle('desktop-glass',glassMode);syncUrl();render();toast(glassMode?'桌面透明磨砂预览已开启':'已切换为标准窗口')}
    function switcher(){const keys=Object.keys(variants),i=keys.indexOf(active);return `<div class="switcher"><button onclick="setVariant(keys[(${i}-1+keys.length)%keys.length])">‹</button><span>${variants[active]}</span><button onclick="setVariant(keys[(${i}+1)%keys.length])">›</button></div>`}
    function topbar(){return `<header class="topbar"><div class="brand"><div class="mark">✦</div><span>雾笺 · AI 创作工作台</span></div><div class="top-actions"><button class="pill" onclick="toggleGlass()">◐ ${glassMode?'桌面玻璃':'标准窗口'}</button><button class="pill" onclick="toast('本地保存已开启')">⌘ 本地模式</button><button class="icon-btn" onclick="toast('设置面板即将打开')">⚙</button><button class="icon-btn" onclick="toast('帮助中心')">?</button></div></header>`}
    function side(){return `<aside class="sidebar glass"><div class="side-title"><b>我的作品</b><button class="icon-btn" onclick="toast('新建作品')">＋</button></div><div class="work-list"><div class="work active"><span class="dot"></span><span>潮汐之下</span></div><div class="work"><span class="dot" style="background:#e7ae64"></span><span>未命名故事</span></div></div><div class="side-section"><h4>作品结构</h4><div class="chapter">⌁ 故事策划</div><div class="chapter">◈ 人物与世界观</div><div class="chapter active">第 01 章　潮声</div><div class="chapter">第 02 章　失物</div><div class="chapter">第 03 章　回信</div></div><div class="side-section"><h4>资料状态</h4><div class="tiny">已确认 <b style="color:#5f75d8">12</b>　待确认 <b style="color:#d58b42">4</b></div></div></aside>`}
    function ai(){return `<aside class="insight glass"><div class="ai-head"><h3>AI 协作</h3><span class="model">Ollama · qwen3</span></div><div class="tiny">当前上下文：第 01 章 · 潮汐之下</div><div class="quick"><button onclick="toast('正在生成续写候选…')">继续写</button><button onclick="toast('正在分析设定…')">检查设定</button><button onclick="toast('正在润色选中段落…')">润色</button><button onclick="toast('打开完整 Agent')">更多</button></div><div class="prompt"><textarea placeholder="告诉 AI 你想怎么写…">让海雾里出现一个不属于这个年代的声音</textarea><button class="primary" style="width:100%" onclick="toast('已生成 2 个候选方案')">生成候选　↗</button></div><div class="result"><strong>候选 · 轻微悬疑</strong><div class="tiny">“潮声忽然停了。林默抬头，看见远处的雾里亮起一盏不该存在的煤油灯。”</div><div class="result-actions"><button onclick="toast('候选已插入预览')">预览插入</button><button onclick="toast('已保存到生成记录')">保存候选</button></div></div><div class="statusline"><span>本次约 1.2k tokens</span><span>⌁ 写作偏好已应用</span></div></aside>`}
    function editor(){return `<main class="main"><div class="eyebrow">第一卷 · 海边小镇</div><div class="title-row"><div><h1>第 01 章　潮声</h1><p class="subtitle">章节目标：让主角第一次听见“过去”的回声</p></div><div><button class="ghost mini" onclick="toast('已创建章节快照')">创建快照</button></div></div><div class="toolbar"><button onclick="document.execCommand('bold')"><b>B</b></button><button onclick="document.execCommand('italic')"><i>I</i></button><button onclick="toast('标题样式')">H</button><button onclick="toast('字体设置')">Aa</button><button onclick="toast('段落设置')">≡</button><span style="flex:1"></span><button onclick="toast('已检查本章')">⌁ 检查</button><button onclick="toast('搜索作品')">⌕</button></div><article class="editor" contenteditable="true"><h2>潮声</h2><p>林默在海边醒来时，天还没有亮。</p><p>潮水退到很远的地方，露出一片湿漉漉的黑色礁石。风从小镇背后吹来，带着盐和旧木头的气味。他摸了摸自己的口袋，里面只有一枚生锈的钥匙。</p><p>他不记得自己是谁，也不记得为什么会来到这里。</p><p>远处忽然传来一声铃响。</p></article><div class="statusline"><span>已自动保存 · 刚刚</span><span>684 字　⌁ 作者创作</span></div></main>`}
    function variantA(){return `${topbar()}<div class="shell">${side()}${editor()}${ai()}</div>${switcher()}`}
    function variantB(){return `${topbar()}<section class="welcome"><div class="hero"><div class="eyebrow">从一个念头开始</div><h1>让故事，慢慢长出自己的潮汐。</h1><p>把一句灵感交给 AI，和它一起找到人物、冲突与第一章。你始终拥有最终决定权。</p><div class="hero-actions"><button class="primary" onclick="toast('进入灵感追问')">新建作品　↗</button><button class="ghost" onclick="toast('打开导入预览')">导入已有小说</button></div><div class="tiny" style="margin-top:18px">无需账号 · 本地优先 · 你的 API 由你掌控</div></div><div class="entry-grid"><button class="entry" onclick="toast('打开最近作品')"><span class="emoji">◒</span><h3>继续创作</h3><p>打开最近编辑的作品和章节</p></button><button class="entry" onclick="toast('打开故事策划')"><span class="emoji">✦</span><h3>发展灵感</h3><p>从一句话开始，生成故事方案</p></button><button class="entry" onclick="toast('打开批量导入')"><span class="emoji">↥</span><h3>批量导入</h3><p>选择文件夹，自动识别卷与章节</p></button><button class="entry" onclick="toast('打开模型设置')"><span class="emoji">⌁</span><h3>配置 AI</h3><p>连接 OpenAI 兼容 API 或 Ollama</p></button></div></section>${switcher()}`}
    function variantC(){return `${topbar()}<section class="dash"><div class="dash-main glass"><div class="eyebrow">星期三 · 8 月 20 日</div><h1>晚上好，林默。</h1><p class="subtitle">潮汐之下 · 第一卷 · 写作进度 18%</p><div class="stat-row"><div class="stat"><span class="tiny">总字数</span><b>12,480</b><span class="tiny">+684 今日</span></div><div class="stat"><span class="tiny">已完成章节</span><b>3 / 18</b><span class="tiny">预计 2 周</span></div><div class="stat"><span class="tiny">待确认资料</span><b>4</b><span class="tiny">需要你的判断</span></div></div><div class="focus"><h3>今日写作计划</h3><div class="task"><span class="check done">✓</span><span>完成第 01 章初稿</span><span class="tiny" style="margin-left:auto">684 字</span></div><div class="task"><span class="check"></span><span>确认林默的人物资料</span><span class="tiny" style="margin-left:auto">4 条</span></div><div class="task"><span class="check"></span><span>检查第一卷时间线</span><span class="tiny" style="margin-left:auto">AI 任务</span></div></div><h3 style="margin:25px 0 11px">最近作品</h3><div class="recent"><div class="recent-item"><span><b>潮汐之下</b><br><span class="tiny">第 01 章 · 刚刚编辑</span></span><button class="mini" onclick="setVariant('A')">继续写</button></div><div class="recent-item"><span><b>未命名故事</b><br><span class="tiny">故事策划 · 昨天</span></span><button class="mini" onclick="toast('打开故事方案')">查看</button></div></div></div><aside class="dash-side glass"><div class="ai-head"><h3>灵感收集</h3><button class="mini" onclick="toast('已记录灵感')">＋ 新灵感</button></div><div class="prompt"><textarea placeholder="记下一个画面、一句话或一个梦…"></textarea><button class="ghost" style="width:100%" onclick="toast('灵感已保存到收集箱')">保存灵感</button></div><div class="result"><strong>待确认资料</strong><div class="tiny">AI 从第 1～3 章发现了 4 条可能的新事实，确认后将加入作品资料。</div><button class="primary" style="width:100%;margin-top:11px" onclick="toast('打开资料确认')">去确认　↗</button></div><div class="focus"><h3>本周写作趋势</h3><div style="height:72px;display:flex;align-items:end;gap:7px;padding-top:10px"><i style="height:25%;background:#a6b5fa;flex:1;border-radius:5px"></i><i style="height:48%;background:#8b9cf2;flex:1;border-radius:5px"></i><i style="height:35%;background:#ac9aee;flex:1;border-radius:5px"></i><i style="height:72%;background:#7188ee;flex:1;border-radius:5px"></i><i style="height:54%;background:#9885e7;flex:1;border-radius:5px"></i><i style="height:84%;background:#6179e7;flex:1;border-radius:5px"></i><i style="height:42%;background:#b4a6ee;flex:1;border-radius:5px"></i></div><div class="tiny" style="display:flex;justify-content:space-between;margin-top:7px"><span>一</span><span>日</span></div></div></aside></section>${switcher()}`}
    function render(){root.innerHTML=active==='A'?variantA():active==='B'?variantB():variantC()}
    window.setVariant=setVariant;window.toggleGlass=toggleGlass;window.toast=toast;window.keys=Object.keys(variants);render();
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')setVariant(window.keys[(window.keys.indexOf(active)-1+window.keys.length)%window.keys.length]);if(e.key==='ArrowRight')setVariant(window.keys[(window.keys.indexOf(active)+1)%window.keys.length])});
  </script>
</body>
</html>
